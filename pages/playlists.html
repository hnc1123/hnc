<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="声屿 SoundIsle 精选歌单，全部为虚构内容。">
  <title>精选歌单 · 声屿 SoundIsle</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="playlists" data-base="../">
  <div class="app">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main">
      <header class="topbar" id="topbarMount"></header>
      <div class="scroll">
        <div class="page-head">
          <h1>精选歌单</h1>
          <span class="sub">编辑挑选的 6 张歌单，点开即可查看详情</span>
        </div>
        <div class="grid" id="allPlaylists"></div>
        <div class="page-foot">
          <span>声屿 SoundIsle · 静态演示站点</span>
          <span>所有内容均为虚构，仅用于课程作业</span>
        </div>
      </div>
    </main>
  </div>

  <div id="playerRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/playlists.js"></script>
</body>
</html>
