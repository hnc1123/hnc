<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="声屿 SoundIsle 本地音乐：导入本机音频文件直接播放，文件不会上传。">
  <title>本地音乐 · 声屿 SoundIsle</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="local" data-base="../">
  <div class="app">
    <aside class="sidebar" id="sidebarMount"></aside>
    <main class="main">
      <header class="topbar" id="topbarMount"></header>
      <div class="scroll">
        <div class="page-head">
          <h1>本地音乐</h1>
          <span class="sub">文件只在浏览器里播放，不会上传到任何地方</span>
        </div>

        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖入音频文件">
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V5"/><path d="M7.5 9.5L12 5l4.5 4.5"/><path d="M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/>
            </svg>
          </div>
          <h3>把音频文件拖到这里</h3>
          <p>或者点击选择文件，支持 mp3 / wav / ogg / m4a 等格式</p>
          <p class="hint">刷新页面后需要重新导入（浏览器不会把文件存到本地）</p>
          <input id="fileInput" type="file" accept="audio/*" multiple hidden>
        </div>

        <div class="local-bar">
          <span class="count" id="fileCount">还没有导入文件</span>
          <div class="actions">
            <button class="btn-line" id="clearLocal">清空列表</button>
            <button class="btn-primary" id="playLocal">播放全部</button>
          </div>
        </div>

        <div id="localList"></div>

        <div class="page-foot">
          <span>声屿 SoundIsle · 静态演示站点</span>
          <span>音频通过 URL.createObjectURL 在本地播放</span>
        </div>
      </div>
    </main>
  </div>

  <div id="playerRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/local.js"></script>
</body>
</html>
