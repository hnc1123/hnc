<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="声屿 SoundIsle —— 一个纯静态的音乐站点演示，所有内容均为虚构。">
  <title>声屿 SoundIsle · 发现音乐</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div class="app">
    <!-- ========================= 侧栏 ========================= -->
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="声屿首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#06121a" stroke-width="1.9" stroke-linecap="round">
            <path d="M4 15.5c2.2-3.6 4.4-3.6 6.6 0s4.4 3.6 6.6 0"/>
            <path d="M4 10.5c2.2-3.6 4.4-3.6 6.6 0s4.4 3.6 6.6 0" opacity=".55"/>
            <circle cx="18.4" cy="5.4" r="1.5" fill="#06121a" stroke="none"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">声屿</span>
          <span class="brand-sub">SOUND ISLE</span>
        </span>
      </a>

      <nav class="nav-group" aria-label="发现">
        <p class="nav-title">发现</p>
        <a class="nav-item active" href="index.html" data-page="发现音乐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5z"/></svg>
          发现音乐
        </a>
        <a class="nav-item" href="#" data-page="排行榜">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-5"/><path d="M3 19h18" opacity=".45"/></svg>
          排行榜
        </a>
        <a class="nav-item" href="#" data-page="精选歌单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 11h10M4 16h6"/><path d="M17.5 9.5v7.2a2 2 0 1 1-1-1.7"/><circle cx="19" cy="9" r="1.6"/></svg>
          精选歌单
          <span class="nav-badge">NEW</span>
        </a>
        <a class="nav-item" href="#" data-page="本地音乐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3l1.6 2h8.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
          本地音乐
        </a>
      </nav>

      <nav class="nav-group" aria-label="我的">
        <p class="nav-title">我的</p>
        <a class="nav-item" href="#" data-page="我的收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4c0 4.8-7 9.1-7 9.1z"/></svg>
          我的收藏
        </a>
        <a class="nav-item" href="#" data-page="最近播放">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.8"/></svg>
          最近播放
        </a>
        <a class="nav-item" href="#" data-page="创建的歌单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          创建的歌单
        </a>
      </nav>

      <div class="side-foot">
        <p><b>纯静态演示</b><br>无服务器 · 数据保存在本地</p>
      </div>
    </aside>

    <!-- ========================= 主区 ========================= -->
    <main class="main">
      <header class="topbar">
        <button class="circle-btn" id="backBtn" title="后退" aria-label="后退">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>
        </button>
        <button class="circle-btn" id="fwdBtn" title="前进" aria-label="前进" style="opacity:.45">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg>
        </button>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4 4"/></svg>
          <input id="searchInput" type="search" placeholder="搜索歌曲、歌手或歌单" aria-label="搜索">
        </div>
        <div class="top-right">
          <button class="ghost-btn" id="loginBtn">登录</button>
          <div class="avatar" title="访客">屿</div>
        </div>
      </header>

      <div class="scroll" id="pageScroll">
        <!-- 首屏 -->
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow"><i></i>每日精选 · <span id="heroDate">11 月 3 日</span></span>
            <h1>把城市调成静音，<br>只留一点<em>回声</em>。</h1>
            <p id="heroDesc">深夜电台第 24 期：九首适合独自走回家的歌，从霓虹路口一路放到楼下。</p>
            <div class="hero-actions">
              <button class="btn-primary" id="heroPlay">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                立即播放
              </button>
              <button class="btn-line" id="heroFav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4c0 4.8-7 9.1-7 9.1z"/></svg>
                收藏本期
              </button>
            </div>
          </div>
          <div class="hero-visual" aria-hidden="true">
            <div class="disc-wrap">
              <div class="disc-glow"></div>
              <div class="disc" id="heroDisc"></div>
              <div class="disc-label">声屿</div>
            </div>
          </div>
        </section>

        <!-- 推荐歌单 -->
        <section class="section">
          <div class="section-head">
            <h2>推荐歌单</h2>
            <span class="sub">根据你的口味，每天更新</span>
            <a class="more" href="#" data-page="精选歌单">查看全部
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
          <div class="grid" id="playlistGrid"></div>
        </section>

        <!-- 排行榜 -->
        <section class="section">
          <div class="section-head">
            <h2>排行榜</h2>
            <span class="sub">每小时更新</span>
            <a class="more" href="#" data-page="排行榜">完整榜单
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
          <div class="charts" id="chartsGrid"></div>
        </section>

        <div class="page-foot">
          <span>声屿 SoundIsle · 静态演示站点</span>
          <span>所有内容均为虚构，仅用于课程作业</span>
        </div>
      </div>
    </main>
  </div>

  <!-- 播放器挂载点 -->
  <div id="playerRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/player.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
